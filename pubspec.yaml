name: galerialeo
description: Una aplicación de galería multimedia en Flutter.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # Paquetes para la galería
  photo_manager: ^3.0.0
  photo_manager_image_provider: 2.2.0
  image_cropper: ^12.2.1
  video_player: ^2.8.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true